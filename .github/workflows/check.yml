name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      # the built client, so a change can be tried and screenshotted before it reaches main
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: client-dist
          path: packages/client/dist
          retention-days: 3
