<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#111214" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Короны Пустоши: пошаговая стратегия в духе «Героев» для Pi Network" />
    <title>Короны Пустоши</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/art/app-icon.webp" />
    <link rel="preload" href="/art/logo.webp" as="image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Alegreya+Sans:wght@400;500;700&display=swap"
    />
    <!-- Pi SDK: optional. The app keeps working (guest / developer login) if it fails to load. -->
    <script
      async
      src="https://sdk.minepi.com/pi-sdk.js"
      onload="window.__piSdkState = 'loaded'"
      onerror="window.__piSdkState = 'failed'"
    ></script>
  </head>
  <body>
    <div id="app" class="app">
      <header id="topbar" class="topbar"></header>
      <div id="hint" class="hint" role="status" aria-live="polite" hidden></div>
      <main id="stage" class="stage">
        <div id="game" class="game" aria-label="Игровое поле"></div>
        <div id="screen" class="screen"></div>
        <div id="overlay" class="overlay" hidden></div>
        <div id="toasts" class="toasts" aria-live="polite"></div>
      </main>
      <nav id="actionbar" class="actionbar" hidden></nav>
    </div>
    <noscript>Для игры нужен JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
